<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="225mm" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description"><title id="title">Lưu đồ đo nhiệt độ, cảnh báo và xử lý lỗi</title><desc id="description">Khởi tạo, đọc DHT11, kiểm tra status, so sánh ngưỡng 30 độ C hoặc phân loại checksum và timeout, cập nhật LCD và LED, trễ 2 giây rồi đọc lại.</desc><rect width="1080" height="1350" fill="white" /><rect x="440.0" y="36.0" width="200" height="58" rx="29" fill="white" stroke="#344B5E" stroke-width="2" /><text x="540" y="74" text-anchor="middle" font-family="Times New Roman" font-size="28" font-weight="bold" fill="#344B5E">Bắt đầu</text><rect x="295.0" y="151.0" width="490" height="112" rx="10" fill="#F1F5F9" stroke="#607487" stroke-width="2" /><text x="540" y="192" text-anchor="middle" font-family="Times New Roman" font-size="26" font-weight="normal" fill="#344B5E">Tắt JTAG; khởi tạo LCD và LED</text><text x="540" y="226" text-anchor="middle" font-family="Times New Roman" font-size="26" font-weight="normal" fill="#344B5E">Hiện màn hình chào khoảng 1,5 s</text><rect x="335.0" y="313.0" width="410" height="84" rx="10" fill="#F1F5F9" stroke="#607487" stroke-width="2" /><text x="540" y="347" text-anchor="middle" font-family="Times New Roman" font-size="26" font-weight="bold" fill="#344B5E">Đọc DHT11</text><text x="540" y="380" text-anchor="middle" font-family="Times New Roman" font-size="24" font-weight="normal" fill="#344B5E">Nhận mã trạng thái status</text><polygon points="540,448.0 715.0,520 540,592.0 365.0,520" fill="#F8FAFC" stroke="#607487" stroke-width="2" /><text x="540" y="513" text-anchor="middle" font-family="Times New Roman" font-size="26" font-weight="normal" fill="#344B5E">Đọc thành công?</text><text x="540" y="548" text-anchor="middle" font-family="Courier New" font-size="24" font-weight="normal" fill="#344B5E">status == 0</text><polygon points="290,685.0 460.0,755 290,825.0 120.0,755" fill="#F8FAFC" stroke="#607487" stroke-width="2" /><text x="290" y="764" text-anchor="middle" font-family="Courier New" font-size="24" font-weight="normal" fill="#344B5E">temp_int &gt;= 30?</text><polygon points="800,685.0 970.0,755 800,825.0 630.0,755" fill="#F8FAFC" stroke="#607487" stroke-width="2" /><text x="800" y="764" text-anchor="middle" font-family="Courier New" font-size="24" font-weight="normal" fill="#344B5E">status == -6?</text><rect x="55.0" y="925.0" width="220" height="150" rx="10" fill="#FFF2F0" stroke="#A85C54" stroke-width="2" /><text x="165" y="968" text-anchor="middle" font-family="Times New Roman" font-size="21" font-weight="bold" fill="#A85C54">CẢNH BÁO</text><text x="165" y="1009" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="normal" fill="#344B5E">Hiện nhiệt độ + *!</text><text x="165" y="1043" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="normal" fill="#344B5E">Bật 5 LED</text><rect x="305.0" y="925.0" width="220" height="150" rx="10" fill="#F0F7F3" stroke="#668673" stroke-width="2" /><text x="415" y="968" text-anchor="middle" font-family="Times New Roman" font-size="21" font-weight="bold" fill="#668673">BÌNH THƯỜNG</text><text x="415" y="1009" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="normal" fill="#344B5E">Hiện nhiệt độ</text><text x="415" y="1043" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="normal" fill="#344B5E">và ngưỡng; tắt LED</text><rect x="555.0" y="925.0" width="220" height="150" rx="10" fill="#FFF8EB" stroke="#9B824B" stroke-width="2" /><text x="665" y="968" text-anchor="middle" font-family="Times New Roman" font-size="21" font-weight="bold" fill="#9B824B">LỖI CHECKSUM</text><text x="665" y="1009" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="normal" fill="#344B5E">Hiện lỗi checksum</text><text x="665" y="1043" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="normal" fill="#344B5E">Tắt 5 LED</text><rect x="805.0" y="925.0" width="220" height="150" rx="10" fill="#FFF8EB" stroke="#9B824B" stroke-width="2" /><text x="915" y="968" text-anchor="middle" font-family="Times New Roman" font-size="21" font-weight="bold" fill="#9B824B">MẤT TÍN HIỆU</text><text x="915" y="1009" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="normal" fill="#344B5E">Hiện lỗi mất tín hiệu</text><text x="915" y="1043" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="normal" fill="#344B5E">Tắt 5 LED</text><rect x="335.0" y="1180.0" width="410" height="80" rx="10" fill="#F1F5F9" stroke="#607487" stroke-width="2" /><text x="540" y="1228" text-anchor="middle" font-family="Times New Roman" font-size="28" font-weight="normal" fill="#344B5E">Trễ phần mềm 2 giây</text><polyline points="540,94 540,151" fill="none" stroke="#607487" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="540,151 535.5,140.0 544.5,140.0" fill="#607487" /><polyline points="540,263 540,313" fill="none" stroke="#607487" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="540,313 535.5,302.0 544.5,302.0" fill="#607487" /><polyline points="540,397 540,448" fill="none" stroke="#607487" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="540,448 535.5,437.0 544.5,437.0" fill="#607487" /><polyline points="365,520 290,520 290,685" fill="none" stroke="#607487" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="290,685 285.5,674.0 294.5,674.0" fill="#607487" /><text x="309" y="505" text-anchor="middle" font-family="Times New Roman" font-size="24" font-weight="normal" fill="#344B5E">Có</text><polyline points="715,520 800,520 800,685" fill="none" stroke="#607487" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="800,685 795.5,674.0 804.5,674.0" fill="#607487" /><text x="781" y="505" text-anchor="middle" font-family="Times New Roman" font-size="24" font-weight="normal" fill="#344B5E">Không</text><polyline points="120,755 90,755 90,880 165,880 165,925" fill="none" stroke="#607487" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="165,925 160.5,914.0 169.5,914.0" fill="#607487" /><text x="87" y="736" text-anchor="middle" font-family="Times New Roman" font-size="24" font-weight="normal" fill="#344B5E">Có</text><polyline points="290,825 290,875 415,875 415,925" fill="none" stroke="#607487" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="415,925 410.5,914.0 419.5,914.0" fill="#607487" /><text x="350" y="861" text-anchor="middle" font-family="Times New Roman" font-size="24" font-weight="normal" fill="#344B5E">Không</text><polyline points="630,755 600,755 600,880 665,880 665,925" fill="none" stroke="#607487" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="665,925 660.5,914.0 669.5,914.0" fill="#607487" /><text x="592" y="736" text-anchor="middle" font-family="Times New Roman" font-size="24" font-weight="normal" fill="#344B5E">Có</text><polyline points="970,755 1000,755 1000,880 915,880 915,925" fill="none" stroke="#607487" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="915,925 910.5,914.0 919.5,914.0" fill="#607487" /><text x="998" y="736" text-anchor="middle" font-family="Times New Roman" font-size="24" font-weight="normal" fill="#344B5E">Không</text><polyline points="165,1075 165,1125" fill="none" stroke="#607487" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><polyline points="415,1075 415,1125" fill="none" stroke="#607487" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><polyline points="665,1075 665,1125" fill="none" stroke="#607487" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><polyline points="915,1075 915,1125" fill="none" stroke="#607487" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><polyline points="165,1125 915,1125" fill="none" stroke="#607487" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><polyline points="540,1125 540,1180" fill="none" stroke="#607487" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="540,1180 535.5,1169.0 544.5,1169.0" fill="#607487" /><polyline points="335,1220 25,1220 25,355 335,355" fill="none" stroke="#607487" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" /><polygon points="335,355 324.0,359.5 324.0,350.5" fill="#607487" /><text x="134" y="1203" text-anchor="middle" font-family="Times New Roman" font-size="23" font-weight="normal" fill="#344B5E">Lặp lại</text></svg>